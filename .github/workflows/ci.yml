name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # New RustSec advisories are published independently of our pushes:
    # re-audit the pinned Cargo.lock daily so a fresh advisory against an
    # unchanged dependency tree is still caught.
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test SQLite backup procedure
        run: python3 deploy/backup/test_sqlite_backup.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action, Rust 1.98.0
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action, Rust 1.98.0
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build release binary
        run: cargo build --release --locked
      - name: Compile private rustdoc
        run: cargo doc --no-deps --document-private-items --locked

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action, Rust 1.98.0
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run tests
        # The suite must stay safe to run with the default (parallel) test
        # runner: per-test database isolation is handled elsewhere, do not
        # reintroduce --test-threads=1 here.
        run: cargo test --locked
        env:
          DATABASE_URL: test_db.sqlite3
          TEST_DATABASE_URL: test_db.sqlite3
          SERVER_ADDRESS: 127.0.0.1:3000
          SECRET_MAX_LENGTH: 128
          CANARY: 🐦
          RATE_LIMIT_COOLDOWN: 1
          RATE_LIMIT_MAX_ATTEMPTS: 3
          STORE_RATE_LIMIT_BURST: 10000
          STORE_RATE_LIMIT_REFILL_PER_SECOND: 10000
          LOOKUP_RATE_LIMIT_BURST: 10000
          LOOKUP_RATE_LIMIT_REFILL_PER_SECOND: 10000
          RATE_LIMIT_MAX_IDENTIFIERS: 100000
          DATABASE_MAX_CONCURRENCY: 16
          ATTEMPTS_SNAPSHOT_TTL_SECONDS: 30

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: deploy/caddy/build/go.mod
          cache-dependency-path: deploy/caddy/build/go.sum
      - name: Verify Caddy module checksums
        working-directory: deploy/caddy/build
        run: go mod download && go mod verify
      - name: Scan Caddy module for known vulnerabilities
        working-directory: deploy/caddy/build
        # The reverse proxy has the larger dependency tree of the two
        # languages; the Rust side is gated daily by cargo audit, and this is
        # its equivalent. It also gates the deliberate golang.org/x/net pin
        # documented in go.mod.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          GOFLAGS=-mod=readonly "$(go env GOPATH)/bin/govulncheck" -mode=source ./...
      - name: Build audited Caddy module
        working-directory: deploy/caddy/build
        run: go build -mod=readonly -trimpath -o "$RUNNER_TEMP/caddy"
      - name: Run Caddy smoke
        run: python3 deploy/caddy/smoke.py "$RUNNER_TEMP/caddy"
