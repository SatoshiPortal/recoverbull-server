name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # New RustSec advisories are published independently of our pushes:
    # re-audit the pinned Cargo.lock daily so a fresh advisory against an
    # unchanged dependency tree is still caught.
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action, Rust 1.99.0
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Shellcheck the deploy script
        run: shellcheck deploy/recoverbull deploy/test/e2e.sh
      - name: Test deployment recovery failures
        run: python3 deploy/test/test_rollback.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action, Rust 1.99.0
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build release binary
        run: cargo build --release --locked
      - name: Compile private rustdoc
        run: cargo doc --no-deps --document-private-items --locked

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action, Rust 1.99.0
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run tests
        # The suite must stay safe to run with the default (parallel) test
        # runner: per-test database isolation is handled elsewhere, do not
        # reintroduce --test-threads=1 here.
        run: cargo test --locked
        env:
          DATABASE_URL: test_db.sqlite3
          TEST_DATABASE_URL: test_db.sqlite3
          SERVER_ADDRESS: 127.0.0.1:3000
          SECRET_MAX_LENGTH: 128
          CANARY: 🐦
          RATE_LIMIT_COOLDOWN: 1
          RATE_LIMIT_MAX_ATTEMPTS: 3
          STORE_RATE_LIMIT_BURST: 10000
          STORE_RATE_LIMIT_REFILL_PER_SECOND: 10000
          LOOKUP_RATE_LIMIT_BURST: 10000
          LOOKUP_RATE_LIMIT_REFILL_PER_SECOND: 10000
          RATE_LIMIT_MAX_IDENTIFIERS: 100000
          DATABASE_MAX_CONCURRENCY: 16
          ATTEMPTS_SNAPSHOT_TTL_SECONDS: 30

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  install:
    # The documented install, upgrade, rollback and refusals, in the Debian 13
    # test container. Tor starts but the onion is never contacted.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action, Rust 1.99.0
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the release binary
        run: cargo build --release --locked
      - name: Start the test container
        run: |
          podman build -t recoverbull-debian13 -f deploy/test/Containerfile .
          podman run -d --name recoverbull-test --privileged --systemd=always recoverbull-debian13
          podman exec recoverbull-test install -d -o op -g op /home/op/recoverbull-server
          tar -cf - --exclude=./target --exclude=./.git . | podman exec -i -u op recoverbull-test tar -xf - -C /home/op/recoverbull-server
          podman exec -u op recoverbull-test git -C /home/op/recoverbull-server init -q
          podman exec -u op recoverbull-test install -d /home/op/recoverbull-server/target/release
          podman cp target/release/recoverbull recoverbull-test:/home/op/recoverbull-server/target/release/recoverbull
          podman exec recoverbull-test chown -R op:op /home/op/recoverbull-server
          podman exec -u op recoverbull-test touch /home/op/recoverbull-server/target/release/recoverbull
      - name: Run the end-to-end scenario
        run: podman exec -u op -w /home/op/recoverbull-server recoverbull-test bash deploy/test/e2e.sh
      - name: Show the journal on failure
        if: failure()
        run: podman exec recoverbull-test journalctl --no-pager -n 200

  nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the current runner nginx package
        # This is a compatibility/smoke gate for the committed configuration,
        # not a production version pin: production uses Debian's package.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nginx
          nginx -V
      - name: Validate and smoke-test the nginx example
        run: python3 deploy/nginx/smoke.py /usr/sbin/nginx
