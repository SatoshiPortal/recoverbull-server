[package]
name = "recoverbull"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"

[dependencies]
sha2 = "0.11"
axum = "0.8.9"
dotenvy = "0.15"
# Minimal feature set: the server uses the multi-thread runtime, TCP, sync
# primitives, timers, Unix/ctrl-c signal handling (for graceful shutdown, see
# main.rs) and (in tests) io traits. "full" would also compile in process
# spawning and filesystem APIs we never call.
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util", "signal"] }
serde = { version = "1.0.210", features = ["derive"] }
diesel = { version = "2.3", features = ["sqlite"] }
libsqlite3-sys = { version = "=0.38.2", features = ["bundled"] }
diesel_migrations = "2.3"
chrono = { version = "0.4.38", features = ["serde"] }
serde_json = "1.0"
hex = "0.4.3"
# The SIMD engine (default `simd-unsafe` feature) is left out: the server only
# validates short inputs, so it would add unaudited unsafe code for nothing.
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
tracing = "0.1"
# Free-space probe for the /store pressure gate; std has no statvfs.
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
flate2 = "1.1"

[dev-dependencies]
axum-test = "21.1.0"

[lints.rust]
unsafe_code = "forbid"
