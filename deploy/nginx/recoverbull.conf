# CI-tested, operator-adapted nginx example; see deploy/README.md. This file is
# included inside nginx's `http` context, not used as a complete nginx.conf.
limit_conn_zone $binary_remote_addr zone=recoverbull_connections:10m;

# Only GET /attempts belongs to the public telemetry bucket. Requests with an
# empty key are not accounted by nginx, so unsupported methods still reach
# Axum and retain its 405 contract instead of becoming edge-generated 503s.
map $request_method $recoverbull_attempts_limit_key {
    GET     $binary_remote_addr;
    default "";
}

limit_req_zone $recoverbull_attempts_limit_key zone=recoverbull_attempts:10m rate=5r/s;
proxy_cache_path /var/cache/nginx/recoverbull levels=1:2 keys_zone=recoverbull_cache:10m max_size=100m inactive=2m use_temp_path=off;

server {
    listen 127.0.0.1:3000;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/recoverbull-error.log crit;
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 35s;
    limit_conn recoverbull_connections 100;
    proxy_http_version 1.1;
    # Stream request bodies immediately so Axum's 30-second middleware bounds
    # their total lifetime. With nginx's default buffering, client_body_timeout
    # only bounds inactivity between reads and a drip-fed body can remain at
    # the proxy without ever entering Axum's timeout.
    proxy_request_buffering off;
    proxy_set_header Host $proxy_host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";

    # nginx-generated shared pressure uses the same public contract as Axum.
    # Upstream responses are not intercepted, so an Axum 503 keeps its own
    # body and Retry-After while limit_req/limit_conn failures come here.
    error_page 503 = @recoverbull_shared_pressure;

    location @recoverbull_shared_pressure {
        internal;
        default_type application/json;
        add_header Retry-After 1 always;
        return 503 '{"error":"Service unavailable"}';
    }

    location = /attempts {
        proxy_pass http://127.0.0.1:3001;
        proxy_connect_timeout 2s;
        proxy_read_timeout 35s;
        proxy_cache recoverbull_cache;
        # The method prevents HEAD from sharing GET bytes; Host, query, body,
        # client headers and the public listener are deliberately absent.
        proxy_cache_key $request_method$uri;
        proxy_cache_methods GET;
        proxy_cache_convert_head off;
        proxy_cache_lock on;
        # The defaults are five seconds. Both gates must cover Axum's whole
        # request bound or a slow cold build admits another upstream request.
        proxy_cache_lock_timeout 35s;
        proxy_cache_lock_age 35s;
        proxy_cache_valid 200 30s;
        limit_req zone=recoverbull_attempts burst=20 nodelay;
        limit_rate 512k;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_connect_timeout 2s;
        proxy_read_timeout 35s;
    }
}
